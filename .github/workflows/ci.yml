name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Connector (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 20
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke Test
        run: npm run smoke

      - name: Check Package Contents
        run: npm run test:package-contents

  windows-boundaries:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test Windows Boundaries
        run: npm run test:windows-boundaries

  macos-manager:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build connector
        run: npm run build

      - name: Test macOS Manager
        run: npm run manager:mac:test

      - name: Verify macOS Manager lifecycle
        run: npm run manager:mac:smoke

      - name: Verify exact external-process takeover
        run: npm run manager:mac:test-takeover

      - name: Package universal macOS Manager
        run: npm run manager:mac:package

      - name: Verify macOS Manager bundle
        run: npm run manager:mac:verify-bundle

      - name: Verify macOS Manager auto-start and recovery
        run: npm run manager:mac:test-autostart

      - name: Verify authenticated secure-tunnel lifecycle
        run: npm run manager:mac:test-secure-tunnel

      - name: Verify install, update, rollback, and removal lifecycle
        run: npm run manager:mac:test-install-lifecycle

      - name: Verify repeated recovery and short soak
        run: npm run manager:mac:test-soak

      - name: Verify development installation lifecycle
        run: |
          CODEXPRO_MAC_OPEN_AFTER_INSTALL=0 npm run manager:mac:install-development
          CODEXPRO_MAC_INSTALLED_APP="$HOME/Applications/CodexPro-Safe Manager.app" npm run manager:mac:verify-installed
